[project]
name = "code-rag"
version = "0.1.0"
description = "Code RAG local e agnóstico: indexe qualquer pasta de código e consulte via MCP ou UI web"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "mcp>=1.9",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-go>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-java>=0.23",
    "fastembed>=0.4",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.ruff]
line-length = 119
target-version = "py312"
